<!doctype html>
<html lang="zh-CN" data-theme="light" data-token-theme="harmonyos">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Row, Column and Stack card</title>
  <style>
    * { box-sizing: border-box; animation: none !important; transition: none !important; }
    html, body { margin: 0; width: 100%; height: 100%; background: #eef3ff; }
    body { font-family: Arial, "PingFang SC", sans-serif; color: #17233d; }
    .screen { display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 22px; width: 390px; height: 844px; padding: 28px 20px; background: #eef3ff; }
    .topbar { display: flex; flex-direction: row; align-items: center; justify-content: space-between; width: 350px; height: 44px; }
    .heading { color: #17233d; font-size: 24px; font-weight: 700; line-height: 32px; }
    .small-action { width: 72px; height: 36px; border: 1px solid #9eb4dc; border-radius: 18px; background: #ffffff; color: #31578f; font-family: inherit; font-size: 13px; }
    .hero { position: relative; width: 350px; height: 230px; overflow: hidden; border-radius: 24px; background: #31578f; }
    .hero-copy { position: absolute; left: 24px; top: 38px; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 10px; width: 250px; }
    .hero-kicker { color: #dbeafe; font-size: 13px; font-weight: 700; line-height: 18px; }
    .hero-title { color: #ffffff; font-size: 27px; font-weight: 700; line-height: 35px; }
    .hero-body { color: #e7efff; font-size: 14px; font-weight: 400; line-height: 21px; }
    .stats { display: flex; flex-direction: row; align-items: flex-start; justify-content: flex-start; gap: 12px; width: 350px; height: 138px; }
    .stat { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 8px; width: 169px; height: 138px; padding: 18px; border: 1px solid #cfdaee; border-radius: 18px; background: #ffffff; }
    .stat-label { color: #6b7b93; font-size: 13px; line-height: 18px; }
    .stat-value { color: #17233d; font-size: 25px; font-weight: 700; line-height: 32px; }
    .stat-note { color: #31578f; font-size: 12px; line-height: 17px; }
    .primary { width: 350px; height: 50px; border: 0; border-radius: 14px; background: #0a59f7; color: #ffffff; font-family: inherit; font-size: 16px; font-weight: 700; }
  </style>
</head>
<body>
  <main class="screen" data-node-id="page" data-component="column">
    <header class="topbar" data-node-id="page.topbar" data-component="row">
      <div class="heading" data-node-id="page.heading" data-component="text">项目概览</div>
      <button class="small-action" data-node-id="page.edit" data-component="button" data-action="project.edit">编辑</button>
    </header>
    <section class="hero" data-node-id="page.hero" data-component="stack">
      <div class="hero-copy" data-node-id="page.hero.copy" data-component="column">
        <div class="hero-kicker" data-node-id="page.hero.kicker" data-component="text">VISUAL BASELINE</div>
        <div class="hero-title" data-node-id="page.hero.title" data-component="text">从结构正确走向视觉一致</div>
        <div class="hero-body" data-node-id="page.hero.body" data-component="text">Stack 叠层和相对定位是首轮重点检查项。</div>
      </div>
    </section>
    <section class="stats" data-node-id="page.stats" data-component="row">
      <article class="stat" data-node-id="page.stats.coverage" data-component="column">
        <div class="stat-label" data-node-id="page.stats.coverage.label" data-component="text">组件覆盖</div>
        <div class="stat-value" data-node-id="page.stats.coverage.value" data-component="text">10</div>
        <div class="stat-note" data-node-id="page.stats.coverage.note" data-component="text">首批契约</div>
      </article>
      <article class="stat" data-node-id="page.stats.viewport" data-component="column">
        <div class="stat-label" data-node-id="page.stats.viewport.label" data-component="text">固定视口</div>
        <div class="stat-value" data-node-id="page.stats.viewport.value" data-component="text">390</div>
        <div class="stat-note" data-node-id="page.stats.viewport.note" data-component="text">CSS pixels</div>
      </article>
    </section>
    <button class="primary" data-node-id="page.export" data-component="button" data-action="project.export">导出鸿蒙工程</button>
  </main>
</body>
</html>
