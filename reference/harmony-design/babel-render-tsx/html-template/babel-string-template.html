  <!--
      模板本身不保存 TSX。外部调用：
      await window.renderTsxString(tsxSource, { componentName })
    -->
  <script>
    const tsxRendererReady = new Promise((resolve) => {
      window.__resolveTsxRenderer = resolve
    })

    window.renderTsxString = (...args) =>
      tsxRendererReady.then((renderer) => renderer(...args))
  </script>

  <script type="module">
    const { default: React } = await import("react")
    const ReactDOMClient = await import("react-dom/client")
    const reactRoot = ReactDOMClient.createRoot(document.getElementById("root"))

    function findPageComponent(pageModule, componentName) {
      if (componentName && pageModule[componentName]) {
        return pageModule[componentName]
      }

      if (pageModule.default) {
        return pageModule.default
      }

      return Object.entries(pageModule).find(
        ([exportName, value]) =>
          typeof value === "function" &&
          !exportName.toLowerCase().endsWith("styles"),
      )?.[1]
    }

    async function renderTsxString(tsxSource, { componentName } = {}) {
      if (!tsxSource.trim()) {
        throw new Error("TSX 字符串不能为空")
      }

      // tsx 兜底导入 import React from "react";
      if (!/^import\s+React[\s,{]/m.test(tsxSource.trimStart())) {
        tsxSource = `import React from "react";\n${tsxSource}`
      }

      const transformResult = Babel.transform(tsxSource, {
        filename: "inline-page.tsx",
        presets: ["typescript", "react"],
        sourceType: "module",
      })
      const pageModuleUrl = URL.createObjectURL(
        new Blob([transformResult.code], { type: "text/javascript" }),
      )

      try {
        const pageModule = await import(pageModuleUrl)
        const PageComponent = findPageComponent(pageModule, componentName)

        if (!PageComponent) {
          throw new Error(
            "没有找到页面组件，请使用 export default 或传入 componentName",
          )
        }

        reactRoot.render(
          React.createElement(
            React.StrictMode,
            null,
            React.createElement(PageComponent),
          ),
        )
      } finally {
        URL.revokeObjectURL(pageModuleUrl)
      }
    }

    window.__resolveTsxRenderer(renderTsxString)
    delete window.__resolveTsxRenderer
  </script>
  <script type="text/plain" id="page-tsx">
    import React from "react";
    // tsx 代码 生成位置
  </script>

  <script>
    const tsxSource = document.getElementById("page-tsx").textContent
    window.renderTsxString(tsxSource).catch(console.error)
  </script>
