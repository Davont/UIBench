# ============================================================
# UIBench - single configuration file
#   options   -> generation run parameters
#   defaults  -> fields shared by every model in `models`
#                (a single entry can override any of these)
#   models    -> the models to compare, side by side
#
# This is a TEMPLATE. Copy it to `config/models.yaml` and fill in your
# own keys. The real `models.yaml` is gitignored so keys never leak.
# ============================================================

# --- run options ---
# max_tokens / request_timeout 留空即不限制（用模型自身默认）
options:
  temperature: 0.0
  # 可选：安装本地 Unsplash MCP 并设置 UNSPLASH_ACCESS_KEY 后启用图片工具。
  image_tools_enabled: true
  image_tool_timeout: 90
  # 单次工具调用可按语义槽位获取的图片数（1-8）。
  image_tool_max_assets: 6

# --- 默认端点：阿里百炼 DashScope（OpenAI 兼容），下面 8 个模型共享 ---
defaults:
  provider: openai
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key: "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"   # <-- 填你的 DashScope key

models:
  # ===== 百炼（DashScope）模型，继承 defaults =====
  - id: MiniMax-M2.5
    name: "MiniMax M2.5"
  - id: kimi-k2.6
    name: "Kimi k2.6"
  - id: qwen3.7-max
    name: "Qwen3.7 Max · 无思考"
    reasoning_effort: none
  - id: qwen3.7-max
    name: "Qwen3.7 Max · low"
    reasoning_effort: low
  - id: qwen3.7-max
    name: "Qwen3.7 Max · medium"
    reasoning_effort: medium
  - id: qwen3.7-max
    name: "Qwen3.7 Max · high"
    reasoning_effort: high
  - id: qwen3.7-plus
    name: "Qwen3.7 Plus"
  - id: glm-5.2
    name: "GLM 5.2 · 无思考"
    reasoning_effort: none
  - id: glm-5.2
    name: "GLM 5.2 · low"
    reasoning_effort: low
  - id: glm-5.2
    name: "GLM 5.2 · medium"
    reasoning_effort: medium
  - id: glm-5.2
    name: "GLM 5.2 · high"
    reasoning_effort: high

  # ===== DeepSeek 官方端点（覆盖 base_url + api_key）=====
  # reasoning_effort: low / high / max（开思考）/ none（关思考）
  # 同一模型按不同思考强度展开为多张卡片，便于横向对比。
  # YAML 锚点 &ds_url / &ds_key 复用，密钥只填一次。
  - id: deepseek-v4-flash
    name: "DeepSeek v4 Flash · 无思考"
    base_url: &ds_url "https://api.deepseek.com/v1"
    api_key: &ds_key "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"   # <-- 填你的 DeepSeek key
    reasoning_effort: none
  - id: deepseek-v4-flash
    name: "DeepSeek v4 Flash · low"
    base_url: *ds_url
    api_key: *ds_key
    reasoning_effort: low
  - id: deepseek-v4-flash
    name: "DeepSeek v4 Flash · high"
    base_url: *ds_url
    api_key: *ds_key
    reasoning_effort: high
  - id: deepseek-v4-flash
    name: "DeepSeek v4 Flash · max"
    base_url: *ds_url
    api_key: *ds_key
    reasoning_effort: max
